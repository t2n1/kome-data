# Khai báo từng loại file xuất từ OBC.
# OBC đổi tên cột khi nâng phiên bản → SỬA FILE NÀY, không sửa code.
zaiko:
  display_name: 在庫一覧
  core_table: core.fact_inventory_daily
  references: {product_code: shohin}
  filename_pattern: '^在庫一覧_(?P<date>\d{8})\.xlsx$'
  sheet: 在庫一覧表
  header_row: 1          # header ở dòng 1 (khác file báo cáo)
  min_rows: 50           # dưới ngưỡng này coi là xuất một phần → cổng 3 chặn
  keys: [product_code, warehouse_code]
  # Ngưỡng cảnh báo cổng 4. Tồn kho là snapshot ổn định nên đặt chặt.
  # File giao dịch theo ngày cần nới rộng hơn (xem Task 10).
  warn_row_drop_ratio: 0.5    # số dòng rơi dưới 50% so lần trước -> cảnh báo
  warn_total_spike: 3.0       # tổng tiền tăng quá 3 lần -> cảnh báo
  warn_total_drop: 0.34       # tổng tiền còn dưới 34% -> cảnh báo
  columns:
    商品コード:     product_code
    商品名:         product_name
    荷姿区分コード: pack_code
    荷姿区分名:     pack_name
    倉庫コード:     warehouse_code
    倉庫名:         warehouse_name
    日本語:         name_ja
    単位:           unit
    賞味期限:       best_before
    売上出荷数量:   shipped_qty      # số xuất TRONG NGÀY (đã xác nhận)
    在庫残数:       stock_qty
    在庫単価:       stock_unit_cost
    在庫金額:       stock_value
  code_columns:  [product_code, pack_code, warehouse_code]
  money_columns: [stock_unit_cost, stock_value]
  # Cột tiền ĐẠI DIỆN của file (tổng hiện trên màn hình nạp + /health, và là
  # số cổng 4 đem so với lần trước). Khai tay — không suy ra từ cột cuối.
  total_column:  stock_value
  qty_columns:   [shipped_qty, stock_qty]
  rate_columns:  []
  # Đối chiếu cho cổng 5: cột tích = thừa số × thừa số
  product_check: {result: stock_value, factors: [stock_qty, stock_unit_cost]}

tokuisaki:
  display_name: 得意先全情報
  core_table: core.dim_customer
  references: {billing_customer_code: tokuisaki}
  filename_pattern: '^得意先全情報_(?P<date>\d{8})\.xlsx$'
  sheet: 得意先データ作成
  header_row: 1
  min_rows: 1000        # bản xuất thiếu từng chỉ có 201 dòng -> phải bị chặn
  keys: [customer_code]
  columns:
    得意先コード: customer_code
    得意先名: customer_name
    支店名: branch_name
    ランクコード: rank_code
    業種・カテゴリーコード: category_code
    注文アプリコード: order_app_code
    売上主担当者コード: salesperson_code
    売価No.コード: price_level_code
    請求締日コード: closing_day_code
    請求先コード: billing_customer_code
    郵便番号: postcode
    都道府県: prefecture
    市区町村: city
    番地: address
    電話番号: phone
    インボイス登録番号: invoice_reg_no
    スポット区分コード: spot_flag
  # 郵便番号 (postcode) PHẢI là TEXT: mã bưu chính Nhật có số 0 đầu (vùng Hokkaido
  # bắt đầu bằng 0) — OBC đã có sẵn lỗi mất số 0 đầu ở một số dòng, ép kiểu số sẽ
  # làm hỏng thêm. code_columns đảm bảo strip + không bị coerce sang số.
  code_columns: [customer_code, rank_code, category_code, order_app_code, salesperson_code,
                 price_level_code, closing_day_code, billing_customer_code, spot_flag, postcode]
  money_columns: []
  qty_columns: []
  rate_columns: []

uriage:
  display_name: 売上伝票データ
  core_table: core.fact_sales_line
  references: {customer_code: tokuisaki, billing_customer_code: tokuisaki, product_code: shohin, shipto_code: chokusousaki}
  filename_pattern: '^売上伝票データ_(?P<date>\d{8})\.xlsx$'
  sheet: 売上伝票データ作成
  header_row: 1
  min_rows: 50
  keys: [slip_no, line_seq]
  # 出荷内訳 và 明細按分 xuất CÙNG một dòng hai lần (cùng slip_no+line_seq,
  # cùng 金額/粗利益) — khử trùng NGAY SAU KHI ĐỌC, trước cổng 3, giữ dòng đầu.
  dedup_on_keys: true
  # File giao dịch theo ngày biến động mạnh hơn snapshot tồn kho (xem ghi
  # chú ở zaiko) -> nới rộng ngưỡng cảnh báo cổng 4.
  warn_row_drop_ratio: 0.3
  warn_total_spike: 5.0
  warn_total_drop: 0.2
  # sales_date có khoá ngoại tới core.dim_date -> ngày không đọc được
  # (rác/rỗng, bị errors="coerce" nuốt thành None) PHẢI chặn ở cổng 3,
  # không được để lô lưu rồi mới bung lỗi khoá ngoại.
  required_date_columns: [sales_date]
  columns:
    伝票No.: slip_no
    明細行番号: line_seq
    売上日付: sales_date
    請求日付: billing_date
    伝票区分: slip_type
    得意先コード: customer_code
    請求先コード: billing_customer_code
    担当者コード: salesperson_code
    部門コード: department_code
    直送先コード: shipto_code
    商品コード: product_code
    荷姿コード: pack_code
    入数: case_qty
    数量: qty
    単価: unit_price
    単位原価: unit_cost
    金額: amount
    消費税額: tax_amount
    原価: cost
    粗利益: gross_profit
    粗利益率: gross_margin
    消費税率: tax_rate
    入金額１: paid_amount
    入金伝票No.１: payment_slip_no
    請求締日コード: closing_day_code
  # line_seq (明細行番号) nằm trong code_columns CÓ CHỦ Ý, đây là ngoại lệ đã
  # xác nhận với luật "mọi cột mã là TEXT": nó là số thứ tự dòng nội bộ của
  # phiếu, không phải mã nghiệp vụ tra cứu chéo hệ thống, nên không có bẫy
  # mất số 0 đầu — cột CSDL tương ứng vẫn là integer (xem 007_fact_sales.sql),
  # Postgres tự ép "1" -> 1 khi insert.
  code_columns: [slip_no, line_seq, slip_type, customer_code, billing_customer_code,
                 salesperson_code, department_code, shipto_code, product_code, pack_code,
                 payment_slip_no, closing_day_code]
  money_columns: [unit_price, unit_cost, amount, tax_amount, cost, gross_profit, paid_amount]
  # 金額 là doanh thu của dòng. KHÔNG phải cột cuối danh sách (入金額１ =
  # paid_amount, gần như luôn 0) — lấy nhầm cột làm /health hiện ¥0 và tắt im
  # lặng cảnh báo lệch tiền của cổng 4 cho chính file doanh thu.
  total_column: amount
  qty_columns: [case_qty, qty]
  rate_columns: [gross_margin, tax_rate]
  date_columns: [sales_date, billing_date]

shohin:
