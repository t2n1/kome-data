    売価No.３（税込）: price_in_03
    売価No.４（税抜）: price_ex_04
    売価No.４（税込）: price_in_04
    売価No.５（税抜）: price_ex_05
    売価No.５（税込）: price_in_05
    売価No.６（税抜）: price_ex_06
    売価No.６（税込）: price_in_06
    売価No.７（税抜）: price_ex_07
    売価No.７（税込）: price_in_07
    売価No.８（税抜）: price_ex_08
    売価No.８（税込）: price_in_08
    売価No.９（税抜）: price_ex_09
    売価No.９（税込）: price_in_09
