meisai:
  display_name: 売上明細表
  core_table: core.fact_sales_line
  references: {customer_code: tokuisaki, product_code: shohin}
  # Nhận cả bản xuất NHIỀU NGÀY mà OBC đặt tên `売上明細表_20260901~24.xlsx`
  # (ngày đầu 8 số, ngày cuối 2 số, cùng tháng; `~` hoặc `～`) — ngày dữ liệu
  # của lô = ngày CUỐI, cùng nếp 請求先元帳. Lưới độ phủ đọc `sales_date` từng
  # dòng nên mọi ngày trong khoảng vẫn được đánh dấu.
  filename_pattern: '^売上明細表_(?:(?P<date>\d{8})|(?P<y>\d{4})(?P<m>\d{2})\d{2}[~～](?P<d>\d{2}))\.xlsx$'
  sheet: 売上明細表
  header_row: 1
  min_rows: 50
  keys: [slip_no, line_seq]
  # KHÔNG có 明細行番号 trong file gốc -- reader tự sinh line_seq (xem
  # synthesize_line_seq trong kome/reader.py, Task 4 của plan này). Dự phòng
  # khi không lấy được 売上伝票データ -- đối chiếu số liệu thật giữa hai nguồn
  # ở docs/cot-day-du-ban-hang.md.
  synthesize_line_seq: true
  warn_row_drop_ratio: 0.3
  warn_total_spike: 5.0
  warn_total_drop: 0.2
  date_columns: [sales_date]
  columns:
    伝票No.: slip_no
    売上日付: sales_date
    伝票区分: slip_type
    得意先コード: customer_code
    担当者コード: salesperson_code
    部門コード: department_code
    商品コード: product_code
    荷姿区分コード: pack_code
    入数: case_qty
    純売上数量: qty
    単価: unit_price
    単位原価: unit_cost
    税込純売上高: amount
    消費税額: tax_amount
    売上原価: cost
    粗利益: gross_profit
    粗利益率: gross_margin
    消費税率: tax_rate
  # 荷姿区分コード/名 xuất hiện HAI LẦN trong file gốc, CÙNG TÊN CỘT: một bản đi
  # kèm ngay 商品名/商品コード ở đầu file (LUÔN có giá trị), một bản tra theo
  # danh mục sản phẩm (RỖNG ở dòng phụ phí/coupon như 代引手数料, 値引きクーポン --
  # không phải sản phẩm thật, ~24% số dòng trong mẫu đã kiểm). pandas tự
  # thêm hậu tố ".1" cho cột trùng THỨ HAI khi đọc, nên khai tên KHÔNG hậu
  # tố ở trên là lấy đúng bản luôn có giá trị -- đã kiểm chứng trên dữ liệu
  # thật: 0/926 dòng lệch nhau giữa 2 bản khi cả hai đều có dữ liệu.
  # Không có 請求先コード/請求日付/請求締日コード/入金額１/入金伝票No.１ trong file
  # gốc -- loader để các cột CSDL tương ứng là NULL/0 (xem kome/loaders/sales.py).
  code_columns: [slip_no, customer_code, salesperson_code, department_code, product_code, pack_code]
  money_columns: [unit_price, unit_cost, amount, tax_amount, cost, gross_profit]
  total_column: amount
  qty_columns: [case_qty, qty]
  rate_columns: [gross_margin, tax_rate]
  required_date_columns: [sales_date]

# 請求先元帳 — sổ công nợ theo BÊN NHẬN HOÁ ĐƠN (đợt 6, migration 038). Đo thật
# 2026-09-24: 5 dòng thông tin (帳票名 / 法人名 / 集計期間 / 集計軸項目 /
# 売上伝票の表示) rồi header ở dòng 6 — bẫy #4 ĐÚNG với 元帳. Sheet tên
# `得意先元帳` CẢ Ở file 請求先元帳 (OBC đặt vậy) — nên phân biệt hai loại sổ bằng
# dòng 集計軸項目 (`so_cai_truc`), không bằng tên sheet. Chuẩn bị riêng ở
# kome/so_cai.py: đọc kỳ từ 集計期間, đối chiếu 【合計】 (cổng 5), bỏ dòng tổng phụ.
# Nhận CẢ tên gốc của OBC (`請求先元帳_2026年 5月 1日　～　2026年 7月31日.xlsx`)
# lẫn dạng `_YYYYMMDD`; ngày dữ liệu = ngày CUỐI kỳ.
seikyu_motocho:
  display_name: 請求先元帳
  core_table: core.fact_ar_ledger
  references: {billing_customer_code: tokuisaki}
  filename_pattern: '^請求先元帳_(?:(?P<date>\d{8})|\d{4}年\s*\d{1,2}月\s*\d{1,2}日\s*～\s*(?P<y>\d{4})年\s*(?P<m>\d{1,2})月\s*(?P<d>\d{1,2})日)\.xlsx$'
  sheet: 得意先元帳
  header_row: 6
  so_cai_truc: 請求先
  min_rows: 100
  keys: [billing_customer_code, row_seq]
  warn_row_drop_ratio: 0.3
  warn_total_spike: 5.0
  warn_total_drop: 0.2
  columns:
    請求先コード: billing_customer_code
    請求先名: billing_customer_name
    請求締日コード: closing_day_code
    請求締日名: closing_day_name
    行タイトル: row_title
    日付: entry_date
    伝票No.: slip_no
    法人口座名: bank_name
    債権額: receivable_amount
    債権調整額: receivable_adj
    売上額: sales_amount
    消費税額: tax_amount
    入金額: payment_amount
    入金調整額: payment_adj
    残高: balance
    摘要: memo
  code_columns: [billing_customer_code, closing_day_code, slip_no]
  money_columns: [receivable_amount, receivable_adj, sales_amount, tax_amount,
                  payment_amount, payment_adj, balance]
  # 債権額 = bán chịu trong kỳ. KHÔNG dùng 残高: cộng số dư CHẠY của mọi dòng là
  # con số vô nghĩa.
  total_column: receivable_amount
  qty_columns: []
  rate_columns: []
  date_columns: [entry_date]
